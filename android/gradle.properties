org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# The project lives in a OneDrive-synced folder, where Gradle's file-system watcher misses change
# events and can report compile tasks UP-TO-DATE after a real edit. Polling is slower but honest.
org.gradle.vfs.watch=false
